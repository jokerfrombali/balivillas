<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Ayu, sales at BaliVillas">
  <defs>
    <clipPath id="ayuClip"><circle cx="80" cy="80" r="80"/></clipPath>
    <linearGradient id="ayuBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ede3"/>
      <stop offset="1" stop-color="#e4dccd"/>
    </linearGradient>
    <linearGradient id="ayuSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8bd97"/>
      <stop offset="1" stop-color="#d9a97f"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#ayuClip)">
    <rect width="160" height="160" fill="url(#ayuBg)"/>

    <!-- плечи и блузка -->
    <path d="M22 160c4-27 22-41 58-46 36 5 54 19 58 46z" fill="#25585a"/>
    <path d="M64 114c5 11 11 17 16 17s11-6 16-17c-6 5-11 7-16 7s-10-2-16-7z" fill="#f6f2ea"/>

    <!-- шея -->
    <path d="M68 96h24v22c0 7-24 7-24 0z" fill="#d9a97f"/>

    <!-- волосы: задняя масса -->
    <path d="M46 74c-2-27 13-45 34-45s36 18 34 45c-1 17-3 29-6 40 2-20-2-38-6-45-9 5-19 7-28 6-11-1-20-4-26-9-3 9-4 28-2 48-3-11-5-23-6-40z" fill="#241c19"/>

    <!-- лицо -->
    <path d="M80 38c16 0 26 12 25 29-1 20-11 34-25 34s-24-14-25-34c-1-17 9-29 25-29z" fill="url(#ayuSkin)"/>

    <!-- чёлка -->
