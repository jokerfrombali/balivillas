    <ellipse cx="69" cy="73" rx="3.1" ry="3.4" fill="#2b211c"/>
    <ellipse cx="91" cy="73" rx="3.1" ry="3.4" fill="#2b211c"/>

    <!-- нос и улыбка -->
    <path d="M80 76v7c0 2-1 3-3 3" stroke="#c08d63" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M73 90c4 4 10 4 14 0" stroke="#a8553f" stroke-width="2.4" stroke-linecap="round" fill="none"/>

    <!-- цветок франжипани в волосах -->
    <g transform="translate(107 56)">
      <g fill="#fdfaf2">
        <ellipse rx="6" ry="3.4" transform="translate(6 0)"/>
        <ellipse rx="6" ry="3.4" transform="translate(1.9 5.7) rotate(72)"/>
        <ellipse rx="6" ry="3.4" transform="translate(-4.9 3.5) rotate(144)"/>
        <ellipse rx="6" ry="3.4" transform="translate(-4.9 -3.5) rotate(216)"/>
        <ellipse rx="6" ry="3.4" transform="translate(1.9 -5.7) rotate(288)"/>
      </g>
      <circle r="2.6" fill="#f0c46a"/>
    </g>
