<script>
/* Villas mega-menu: hover the Villas nav item to reveal the districts/sections panel */
(function () {
  var trigger = document.querySelector('.mega-trigger');
  var panel = document.getElementById('villasPanel');
  if (!trigger || !panel) return;
  var backdrop = document.getElementById('villasBackdrop');
  var chevron = trigger.querySelector('.mega-chevron');
  var open = false;
  function openMega() {
    if (open) return; open = true;
    panel.classList.add('open');
    if (backdrop) backdrop.classList.add('open');
    if (chevron) chevron.classList.add('open');
  }
  function closeMega() {
    if (!open) return; open = false;
    panel.classList.remove('open');
    if (backdrop) backdrop.classList.remove('open');
    if (chevron) chevron.classList.remove('open');
  }
  trigger.addEventListener('mouseenter', openMega);
  if (backdrop) backdrop.addEventListener('click', closeMega);
  /* close once the pointer leaves the trigger+panel zone */
  document.addEventListener('mousemove', function (e) {
    if (!open) return;
    var pr = panel.getBoundingClientRect();
    var tr = trigger.getBoundingClientRect();
    var inZone = e.clientY >= tr.top && e.clientY <= pr.bottom + 8
                 && e.clientX >= pr.left - 24 && e.clientX <= pr.right + 24;
    if (!inZone && e.clientY > tr.bottom) closeMega();
  });
  /* click outside closes */
  document.addEventListener('click', function (e) {
    if (!trigger.contains(e.target) && !panel.contains(e.target)) closeMega();
  });
  /* Escape closes */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeMega();
  });
})();
</script>
